# Render Blueprint: one free web service. MONGO_URI is entered in the Render dashboard.
services:
  - type: web
    name: todo-notes
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: NODE_VERSION
        value: "22"
